name: jant-dev

services:
  jant:
    image: ${DEV_IMAGE:-jant:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PORT: ${PORT:-3000}
      TZ: ${TZ:-UTC}
      STORAGE_DRIVER: local
      DISCOVER_PING_URL: ""
    volumes:
      - type: bind
        source: ${JANT_DEV_SEED_DIR:-./.cache/missing-docker-dev-seed}
        target: /seed
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/jant:uid=1000,gid=1000,mode=0700
    command:
      - sh
      - -ec
      - |
        umask 077
        cp -R /seed/. /var/lib/jant/
        jant migrate --node
        exec jant start
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
