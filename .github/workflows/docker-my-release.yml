name: Publish and deploy my-release

on:
  push:
    branches: [my-release]
  workflow_dispatch:

concurrency:
  group: docker-my-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish personal image
    if: github.repository == 'chenyahui/jant' && github.ref == 'refs/heads/my-release'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          # Use the commit date so rerunning a commit keeps its version tag.
          date="$(TZ=Asia/Shanghai date -d "$(git show -s --format=%cI HEAD)" +%Y%m%d)"
          version="v${date}-${revision:0:7}"
          image="ccr.ccs.tencentyun.com/chenyahui/jant-my-release"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "revision=${revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: jant:my-release-smoke
          build-args: JANT_BUILD_ID=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=docker-my-release
          cache-to: type=gha,scope=docker-my-release,mode=max

      - name: Run the Compose quick start
        run: bash scripts/docker-smoke.sh jant:my-release-smoke

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push Docker image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: JANT_BUILD_ID=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=Jant my-release
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=docker-my-release
          cache-to: type=gha,scope=docker-my-release,mode=max

      - name: Write image summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## Published image'
            echo
            echo "- ${IMAGE}:latest"
            echo "- ${IMAGE}:${VERSION}"
            echo "- ${IMAGE}@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy test environment
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: jant-test
      url: https://jant.cyhone.com
    steps:
      - name: Deploy the published image over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n%s' "$TCR_USERNAME" "$TCR_PASSWORD" | ssh \
            -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "jant@${DEPLOY_HOST}" "$IMAGE"

      - name: Check HTTPS readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 https://jant.cyhone.com/readyz

      - name: Write deployment summary
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo '## Test environment'
            echo
            echo '- URL: https://jant.cyhone.com'
            echo "- Version: ${VERSION}"
            echo "- Digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
